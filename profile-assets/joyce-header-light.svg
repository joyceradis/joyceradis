<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Dra. Joyce Radis — Medicine × Software</title>
<desc id="desc">Profile header with a stylized narrow-QRS sinus-rhythm trace and system-status typography.</desc>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9f1239"/>
    <stop offset="1" stop-color="#e11d48"/>
  </linearGradient>
  <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1200" height="360" rx="28" fill="#f8fafc"/>
<rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#e2e8f0" stroke-width="2"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Liberation Mono,monospace">
  <text x="64" y="66" font-size="15" letter-spacing="4" fill="#64748b">JOYCE // MED × CODE</text>
  <text x="64" y="126" font-size="46" font-weight="700" letter-spacing="-1" fill="#0f172a">DRA. JOYCE RADIS</text>
  <text x="64" y="160" font-size="18" letter-spacing="2.2" fill="#475569">MEDICINE × SOFTWARE</text>
  <text x="64" y="208" font-size="16" fill="#334155">real workflow → working software</text>

  <g font-size="13" letter-spacing="1.2">
    <text x="64" y="306" fill="#64748b">CLINICAL DOMAIN</text>
    <text x="212" y="306" fill="#9f1239">[ACTIVE]</text>
    <text x="330" y="306" fill="#64748b">PRODUCT</text>
    <text x="402" y="306" fill="#9f1239">[BUILDING]</text>
    <text x="546" y="306" fill="#64748b">SOFTWARE</text>
    <text x="628" y="306" fill="#9f1239">[ITERATING]</text>
    <text x="784" y="306" fill="#64748b">PROJECTS</text>\n    <text x="855" y="306" fill="#9f1239">[LIVE]</text>
  </g>
</g>

<path d="M64 252 H140 C150 252 154 244 162 244 C170 244 174 252 184 252 H214 L220 257 L226 210 L232 276 L238 244 L246 252 H278 C290 252 296 238 310 238 C324 238 330 252 344 252 H402 C412 252 416 244 424 244 C432 244 436 252 446 252 H476 L482 257 L488 210 L494 276 L500 244 L508 252 H540 C552 252 558 238 572 238 C586 238 592 252 606 252 H664 C674 252 678 244 686 244 C694 244 698 252 708 252 H738 L744 257 L750 210 L756 276 L762 244 L770 252 H802 C814 252 820 238 834 238 C848 238 854 252 868 252 H1136"
      fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M64 252 H140 C150 252 154 244 162 244 C170 244 174 252 184 252 H214 L220 257 L226 210 L232 276 L238 244 L246 252 H278 C290 252 296 238 310 238 C324 238 330 252 344 252 H402 C412 252 416 244 424 244 C432 244 436 252 446 252 H476 L482 257 L488 210 L494 276 L500 244 L508 252 H540 C552 252 558 238 572 238 C586 238 592 252 606 252 H664 C674 252 678 244 686 244 C694 244 698 252 708 252 H738 L744 257 L750 210 L756 276 L762 244 L770 252 H802 C814 252 820 238 834 238 C848 238 854 252 868 252 H1136"
      fill="none" stroke="url(#accent)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"
      stroke-dasharray="1180" stroke-dashoffset="1180" filter="url(#softGlow)">
  <animate attributeName="stroke-dashoffset" values="1180;0;0" keyTimes="0;0.72;1" dur="4.8s" repeatCount="indefinite"/>
