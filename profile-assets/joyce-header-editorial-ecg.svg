<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Dra. Joyce Radis — Medicine × Software</title>
<desc id="desc">Editorial medical-tech header with animated stylized sinus-rhythm ECG and narrow QRS complexes.</desc>
<style>
:root{--bg:#f8fafc;--panel:#f8fafc;--text:#0f172a;--muted:#475569;--line:#e2e8f0;--grid:#edf2f7;--accent:#9f1239;--accent2:#e11d48;--trace:#cbd5e1}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--panel:#0b1020;--text:#f8fafc;--muted:#a8b4ce;--line:#202a42;--grid:#141c2d;--accent:#fb7185;--accent2:#ff3f67;--trace:#26324e}}
@media (prefers-reduced-motion:reduce){.trace-live{stroke-dashoffset:0!important}animate{display:none!important}}
</style>
<defs>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="smallGrid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern>
<pattern id="grid" width="90" height="90" patternUnits="userSpaceOnUse"><rect width="90" height="90" fill="url(#smallGrid)"/><path d="M90 0H0V90" fill="none" stroke="var(--line)" stroke-width="1.15" opacity=".55"/></pattern>
</defs>
<rect width="1200" height="360" rx="28" fill="var(--bg)"/><rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="var(--line)" stroke-width="2"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
<text x="64" y="72" font-size="13" letter-spacing="3.1" font-weight="700" fill="var(--accent)">PHYSICIAN · MEDICAL EXPERT · SOFTWARE</text>
<text x="64" y="144" font-size="56" font-weight="700" letter-spacing="-2.2" fill="var(--text)">Dra. Joyce Radis</text>
<text x="66" y="181" font-size="18" letter-spacing=".4" fill="var(--muted)">real clinical workflow → structured systems</text>
<g font-size="12.5" font-weight="600" letter-spacing="1.2"><text x="65" y="308" fill="var(--muted)">EMERGENCY CARE</text><text x="218" y="308" fill="var(--accent)">01</text><text x="282" y="308" fill="var(--muted)">MEDICO-LEGAL</text><text x="420" y="308" fill="var(--accent)">02</text><text x="484" y="308" fill="var(--muted)">SOFTWARE</text><text x="584" y="308" fill="var(--accent)">03</text></g>
</g>
<g transform="translate(665,56)">
<rect width="465" height="244" rx="20" fill="var(--panel)" stroke="var(--line)" stroke-width="1.4"/><rect x="16" y="16" width="433" height="166" rx="13" fill="url(#grid)"/>
<text x="28" y="213" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" letter-spacing="1.15" fill="var(--muted)">SINUS RHYTHM · NARROW QRS · CONTINUOUS TRACE</text>
<path d="M28 105 H55 C61 105 64 98 69 98 C74 98 77 105 83 105 H103 L109 108 L114 74 L119 130 L124 96 L129 105 H155 C165 105 170 88 184 88 C198 88 203 105 215 105 H247 C253 105 256 98 261 98 C266 98 269 105 275 105 H295 L301 108 L306 74 L311 130 L316 96 L321 105 H347 C357 105 362 88 376 88 C390 88 395 105 407 105 H433" fill="none" stroke="var(--trace)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
<path class="trace-live" d="M28 105 H55 C61 105 64 98 69 98 C74 98 77 105 83 105 H103 L109 108 L114 74 L119 130 L124 96 L129 105 H155 C165 105 170 88 184 88 C198 88 203 105 215 105 H247 C253 105 256 98 261 98 C266 98 269 105 275 105 H295 L301 108 L306 74 L311 130 L316 96 L321 105 H347 C357 105 362 88 376 88 C390 88 395 105 407 105 H433" fill="none" stroke="url(#accent)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" pathLength="1000" stroke-dasharray="165 835" stroke-dashoffset="0" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="3.2s" calcMode="linear" repeatCount="indefinite"/></path>
<circle cx="433" cy="105" r="4.5" fill="var(--accent2)"><animate attributeName="opacity" values=".25;1;.25" dur="1.2s" repeatCount="indefinite"/></circle>
</g></svg>